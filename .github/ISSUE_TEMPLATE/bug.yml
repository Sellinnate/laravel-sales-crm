name: Bug Report
description: Report an issue or a bug of the package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce the bug
      description: Steps, the relevant config values (workspaces, authorization, email) and the code you ran.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel and Livewire versions
      placeholder: Laravel 12.30, Livewire 4.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MySQL / MariaDB
        - PostgreSQL
        - SQLite
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Stack traces, logs or screenshots.
